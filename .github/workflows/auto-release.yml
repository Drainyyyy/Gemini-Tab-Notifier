name: Auto-Release

on:
  push:
    branches:
      - main
    paths:
      - 'gemini-tab-notifier.user.js'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version from Script
        id: get_version
        run: |
          VERSION=$(awk '/@version/ {print $3}' gemini-tab-notifier.user.js)
          
          if [ -z "$VERSION" ]; then
            echo "Error: Version number could not be extracted!"
            exit 1
          fi
          
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Extracted version: $VERSION"

      - name: Check if Tag Exists
        id: check_tag
        run: |
          if git rev-parse "v${{ env.VERSION }}" >/dev/null 2>&1; then
            echo "Tag v${{ env.VERSION }} exists."
            echo "EXISTS=true" >> $GITHUB_ENV
          else
            echo "Tag v${{ env.VERSION }} does not exist."
            echo "EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Create Release
        if: env.EXISTS == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          generate_release_notes: true
          files: gemini-tab-notifier.user.js