             L 50 48
             Q 50 50, 52 50
             L 90 50
             A 40 40 0 0 0 50 90
             A 40 40 0 0 0 10 50
             A 40 40 0 0 0 50 10 Z" fill="#1A73E8" />

    <!-- Top-Right Quarter Notification (Alert Red, Broken Off) -->
